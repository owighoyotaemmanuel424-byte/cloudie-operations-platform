services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cloudie, POSTGRES_PASSWORD: cloudie_dev_password, POSTGRES_DB: cloudie }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cloudie -d cloudie"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cloudie:cloudie_dev_password@postgres:5432/cloudie?schema=public
      DIRECT_URL: postgresql://cloudie:cloudie_dev_password@postgres:5432/cloudie?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: infra/Dockerfile.web }
    env_file: .env
    environment: { API_URL: http://api:4000, DATABASE_URL: postgresql://cloudie:cloudie_dev_password@postgres:5432/cloudie?schema=public, REDIS_URL: redis://redis:6379 }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { postgres_data: {}, redis_data: {}, minio_data: {} }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudie Operations Platform</title>
    <!--
      Deep-link fallback for hosts that answer unknown paths with a static 404
      instead of the SPA shell (no `try_files`/rewrite). The intended path is
      parked in sessionStorage, the browser is sent to `/`, and `src/main.tsx`
      restores it with history.replaceState before the router mounts — so
      /dashboard, /marketplace and /admin still open the app.

      Storage is not always available (private browsing blocks it). Then the
      same target travels in `?cloudie-redirect=` instead, and `src/main.tsx`
      consumes that parameter on landing.

      Hosts with a real rewrite (nginx, vercel.json) never reach this file.
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: #f5f3ee;
        color: #192320;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      p {
        font-size: 14px;
        opacity: 0.7;
      }
    </style>
    <script>
      (function () {
        var target = location.pathname + location.search + location.hash;
        var parked = false;
        try {
          sessionStorage.setItem("cloudie:spa-redirect", target);
          parked = true;
        } catch (e) {
          /* Storage blocked (strict privacy mode) — carry the path in the URL. */
        }
        location.replace(
          parked ? "/" : "/?cloudie-redirect=" + encodeURIComponent(target),
        );
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>
        This page needs JavaScript. Open
        <a href="/">cloudie.wuaze.com</a> instead.
      </p>
    </noscript>
  </body>
</html>

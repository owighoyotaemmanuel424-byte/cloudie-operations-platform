name: Turso API CI

on:
  pull_request:
    paths:
      - "api/**"
      - "migrations/**"
      - ".github/workflows/neon-api.yml"
  push:
    branches: [main, "fix/neon-migration-readiness"]
    paths:
      - "api/**"
      - "migrations/**"
      - "render.yaml"
      - ".github/workflows/neon-api.yml"

jobs:
  api-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate:dry-run
      - run: npm test

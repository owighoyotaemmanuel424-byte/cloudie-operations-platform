name: Build Cloudie for InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository currently has no root package-lock.json, so npm ci and
      # setup-node's root npm cache cannot work until a root lockfile is committed.
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production frontend
        env:
          VITE_NEON_API_URL: ${{ vars.VITE_NEON_API_URL || 'https://cloudie-glaa.onrender.com' }}
        run: npm run build

      - name: Prepare and verify static output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/.htaccess
          test -s dist/sw.js

          node scripts/verify-dist.mjs
          echo "Verified deployable files:"
          find dist -maxdepth 3 -type f -print | sort

      - name: Package site with files at ZIP root
        shell: bash
        run: |
          set -euo pipefail
          rm -f cloudie-infinityfree-site.zip
          (cd dist && zip -qr ../cloudie-infinityfree-site.zip .)
          unzip -l cloudie-infinityfree-site.zip
          unzip -Z1 cloudie-infinityfree-site.zip | grep -qx 'index.html'
          unzip -Z1 cloudie-infinityfree-site.zip | grep -qx '.htaccess'
          unzip -Z1 cloudie-infinityfree-site.zip | grep -qx '404.html'

      - name: Upload deployable site
        uses: actions/upload-artifact@v4
        with:
          name: cloudie-infinityfree-site
          path: cloudie-infinityfree-site.zip
          if-no-files-found: error
          retention-days: 7

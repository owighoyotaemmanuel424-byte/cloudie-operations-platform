name: Vercel + Turso migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend and shared runtime dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Install API development dependencies
        run: npm install --prefix api --no-audit --no-fund
      - name: Typecheck Turso API
        run: npm --prefix api run typecheck
      - name: Run API security and smoke tests
        run: npm --prefix api test
      - name: Validate ordered Turso migration inventory
        run: npm run migrate:turso:dry-run

name: Vercel + Turso migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend and shared runtime dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Install API development dependencies
        run: npm install --prefix api --no-audit --no-fund
      - name: Typecheck Turso API
        run: npm --prefix api run typecheck
      - name: Typecheck Vercel serverless entrypoint
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --types node "api/[...path].ts"
      - name: Run API security and smoke tests
        run: npm --prefix api test
      - name: Syntax-check migration utilities
        run: node --check api/scripts/migrate-turso.mjs && node --check api/scripts/migrate-postgres-to-turso.mjs
      - name: Validate ordered Turso migration inventory
        run: npm run migrate:turso:dry-run
      - name: Apply schema to an isolated local libSQL database
        run: TURSO_DATABASE_URL=file:/tmp/cloudie-turso-ci.db npm run migrate:turso

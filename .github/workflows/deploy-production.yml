name: Deploy Cloudie Backend + Verify Vercel Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudie-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Convex backend and verify the Vercel build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install API dependencies from lockfile
        run: npm --prefix api ci --no-audit --no-fund

      - name: Verify production deploy key is configured
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add CONVEX_DEPLOY_KEY in GitHub repository Settings > Secrets and variables > Actions. Use the production deploy key from the correct Convex deployment."
            exit 1
          fi

      # Convex still serves most customer screens, so its functions ship here.
      # The frontend and the Turso-backed API deploy from Vercel's Git
      # integration; this job only proves that what Vercel will build is sound.
      - name: Deploy Convex schema and functions, then build the frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_NEON_API_SAME_ORIGIN: "true"
        run: npx convex deploy --cmd "npm run build" --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Verify the production build
        run: npm run smoke:dist

      - name: Typecheck the Vercel function entrypoint
        run: npx tsc -p api/tsconfig.json --pretty false

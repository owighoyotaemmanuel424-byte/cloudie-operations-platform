name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate, Convex check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The wallet, refund and idempotency invariants live in these tests. They
      # ran nowhere for a long time, which is how 49 of them went red without
      # anyone noticing — a suite nobody runs is not a safety net.
      - name: Unit & integration tests
        run: bun test

      - name: Convex validation
        run: CONVEX_AGENT_MODE=anonymous npx convex dev --once

      - name: TypeScript validation
        run: npx tsc -b --pretty false

      - name: ESLint (feature surface)
        run: npx eslint src/pages/MyServices.tsx src/pages/Billing.tsx src/convex/serviceHub.ts src/convex/auth/emailOtp.ts src/convex/auth.config.ts

      - name: Production build
        run: npm run build

  validate-neon-api:
    name: Neon API tests and TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: API security and route smoke tests
        run: npm test
      - name: API TypeScript build
        run: npm run build

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Do not call a missing npm script here. Convex-removal verification must
      # be added only once the migration audit script exists in package.json.
      # The wallet, refund and idempotency invariants live in these tests. They
      # ran nowhere for a long time, which is how 49 of them went red without
      # anyone noticing — a suite nobody runs is not a safety net.
      - name: Unit & integration tests
        run: bun test

      - name: TypeScript validation
        run: npx tsc -b --pretty false

      - name: ESLint (feature surface)
        run: npx eslint src/pages/MyServices.tsx src/pages/Billing.tsx src/convex/serviceHub.ts src/convex/auth/emailOtp.ts src/convex/auth.config.ts

      # No database is configured in CI, so this validates migration ordering,
      # checksums and statement planning without connecting anywhere.
      - name: Migration files plan cleanly (offline dry-run)
        run: npm run migrate:dry-run

      # Regenerate the trace from checked-out source before validating it.
      # This prevents a stale generated document from blocking build validation.
      - name: Regenerate and validate Convex-to-Neon migration trace
        run: |
          node scripts/trace-convex-usage.mjs
          node scripts/trace-convex-usage.mjs --check

      - name: Production build
        env:
          VITE_NEON_API_URL: ${{ vars.VITE_NEON_API_URL || 'https://cloudie-glaa.onrender.com' }}
        run: npm run build

      - name: Verify production build assets and .htaccess
        run: npm run smoke:dist

  validate-neon-api:
    name: Validate Neon API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Authentication and security smoke tests
        run: npm test
